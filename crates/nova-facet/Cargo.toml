[package]
name = "nova-facet"
description = "facet integration for NOVA: reflection-based (de)serialization to text, binary and values"
version.workspace = true
edition.workspace = true
license.workspace = true

# facet moves quickly; the binding is written against this exact release.
[dependencies]
nova-value = { workspace = true, features = ["facet"] }
nova-text.workspace = true
nova-binary.workspace = true
nova-schema.workspace = true
facet = "=0.46.5"
facet-reflect = "=0.46.5"

[dev-dependencies]
nova-serde.workspace = true
nova-value = { workspace = true, features = ["facet", "serde"] }
serde.workspace = true
