[package]
name = "novafile-schemars"
description = "JSON Schema and schemars integration for NOVA schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["nova", "json-schema", "schemars", "schema"]
categories = ["encoding"]

[dependencies]
# The `schemars` feature gives the value types `JsonSchema` impls with `x-nova-kind` markers.
novafile-value = { workspace = true, features = ["schemars"] }
novafile-schema.workspace = true
novafile-json.workspace = true
schemars = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
novafile-value = { workspace = true, features = ["serde", "schemars"] }
novafile-text.workspace = true
novafile-serde.workspace = true
serde.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
