[package]
name = "novafile-facet"
description = "facet integration for NOVA: reflection-based (de)serialization to text, binary and values"
version.workspace = true
edition.workspace = true
license.workspace = true

# facet moves quickly; the binding is written against this exact release.
[dependencies]
novafile-value = { workspace = true, features = ["facet"] }
novafile-text.workspace = true
novafile-binary.workspace = true
novafile-schema.workspace = true
facet = "=0.46.5"
facet-reflect = "=0.46.5"

[dev-dependencies]
novafile-serde.workspace = true
novafile-value = { workspace = true, features = ["facet", "serde"] }
serde.workspace = true
