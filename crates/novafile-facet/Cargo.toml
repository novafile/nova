[package]
name = "novafile-facet"
description = "facet integration for NOVA: reflection-based (de)serialization to text, binary and values"
version.workspace = true
edition.workspace = true
# facet-reflect needs smallvec 2.0.0-beta.5, which needs Rust 1.100.
rust-version = "1.100"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["nova", "facet", "reflection", "serialization"]
categories = ["encoding"]

# facet moves quickly; the binding is written against this exact release.
[dependencies]
novafile-value = { workspace = true, features = ["facet"] }
novafile-text.workspace = true
novafile-binary.workspace = true
novafile-schema.workspace = true
facet.workspace = true
facet-reflect.workspace = true

[dev-dependencies]
novafile-serde = { workspace = true, features = ["binary", "schema"] }
novafile-value = { workspace = true, features = ["facet", "serde"] }
serde.workspace = true

[lints]
workspace = true
