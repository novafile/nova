[package]
name = "novafile"
description = "NOVA, the Notation for Objects, Values & Agents: one semantic model, several representations (umbrella crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["serde", "binary", "patch", "schema", "revision"]
# Content revisions (`value::revision`): SHA-256, via `sha2`. Implied by `patch` and `schema`.
revision = ["novafile-value/revision"]
serde = ["dep:novafile-serde"]
# Binary frames and streams; with `serde`, also `serde::to_vec` / `from_slice`.
binary = ["dep:novafile-binary", "novafile-serde?/binary"]
# Paths, queries and patches.
patch = ["dep:novafile-patch"]
# Schemas; with `serde`, also `serde::from_str_with_schema`.
schema = ["dep:novafile-schema", "novafile-serde?/schema"]
derive = ["schema", "novafile-schema/derive"]
# `NovaSchema` for `url::Url`, `uuid::Uuid` and `semver::Version`, as standard library types.
url = ["schema", "novafile-schema/url"]
uuid = ["schema", "novafile-schema/uuid"]
semver = ["schema", "novafile-schema/semver"]
# Needs Rust 1.100 (see novafile-facet); every other feature builds with the workspace rust-version.
facet = ["dep:novafile-facet"]
formats = ["dep:novafile-formats", "dep:novafile-json"]
proto = ["dep:novafile-proto"]
template = ["dep:novafile-template"]
lint = ["dep:novafile-lint"]
schemars = ["dep:novafile-schemars"]
full = ["serde", "binary", "patch", "schema", "revision", "derive", "facet", "formats", "proto", "template", "lint", "schemars"]

[dependencies]
novafile-value.workspace = true
novafile-text.workspace = true
novafile-binary = { workspace = true, optional = true }
novafile-schema = { workspace = true, optional = true }
novafile-patch = { workspace = true, optional = true }
novafile-serde = { workspace = true, optional = true }
novafile-facet = { workspace = true, optional = true }
novafile-json = { workspace = true, optional = true }
novafile-formats = { workspace = true, optional = true }
novafile-proto = { workspace = true, optional = true }
novafile-template = { workspace = true, optional = true }
novafile-lint = { workspace = true, optional = true }
novafile-schemars = { workspace = true, optional = true }

[lints]
workspace = true
