[package]
name = "novafile"
description = "NOVA, the Notation for Objects, Values & Agents: one semantic model, several representations (umbrella crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["serde"]
serde = ["dep:novafile-serde"]
derive = ["novafile-schema/derive"]
facet = ["dep:novafile-facet"]
formats = ["dep:novafile-formats", "dep:novafile-json"]
proto = ["dep:novafile-proto"]
template = ["dep:novafile-template"]
lint = ["dep:novafile-lint"]
schemars = ["dep:novafile-schemars"]
full = ["serde", "derive", "facet", "formats", "proto", "template", "lint", "schemars"]

[dependencies]
novafile-value.workspace = true
novafile-text.workspace = true
novafile-binary.workspace = true
novafile-schema.workspace = true
novafile-patch.workspace = true
novafile-serde = { workspace = true, optional = true }
novafile-facet = { workspace = true, optional = true }
novafile-json = { workspace = true, optional = true }
novafile-formats = { workspace = true, optional = true }
novafile-proto = { workspace = true, optional = true }
novafile-template = { workspace = true, optional = true }
novafile-lint = { workspace = true, optional = true }
novafile-schemars = { workspace = true, optional = true }

[lints]
workspace = true
