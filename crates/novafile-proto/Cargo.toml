[package]
name = "novafile-proto"
description = "Schema-driven Protocol Buffers (proto3) adapter for NOVA values"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
novafile-value = { path = "../novafile-value" }
novafile-schema = { path = "../novafile-schema" }
novafile-text = { path = "../novafile-text" }

[dev-dependencies]
prost-reflect = { version = "0.16.5", features = ["text-format"] }
protox = "0.10.0"
