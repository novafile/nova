[package]
name = "nova-value"
description = "NOVA semantic value model, canonical encoding and revisions"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
serde = ["dep:serde"]
facet = ["dep:facet"]
# `schemars::JsonSchema` for the value types, so derived JSON Schemas map back
# to the exact NOVA kinds (see `nova-schemars`).
schemars = ["dep:schemars", "dep:serde_json"]

[dependencies]
sha2.workspace = true
num-bigint = "0.4"
serde = { workspace = true, optional = true }
facet = { version = "=0.46.5", optional = true }
schemars = { version = "1", optional = true, default-features = false, features = ["std"] }
serde_json = { workspace = true, optional = true }
