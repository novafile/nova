[package]
name = "novafile-derive"
description = "#[derive(NovaSchema)]: NOVA schemas from Rust types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["nova", "schema", "derive", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "encoding"]

[lib]
proc-macro = true

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro-crate.workspace = true
proc-macro2.workspace = true

# Path-only on purpose: these crates depend on novafile-derive, and cargo drops versionless
# path dev-dependencies when publishing, which breaks the cycle.
[dev-dependencies]
novafile-schema = { path = "../novafile-schema", features = ["derive", "url", "uuid", "semver"] }
novafile-value = { path = "../novafile-value" }
novafile-text = { path = "../novafile-text" }
novafile-serde = { path = "../novafile-serde" }
proptest.workspace = true
serde.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
semver = { workspace = true, features = ["serde"] }

[lints]
workspace = true
