[package]
name = "nova-schema"
description = "NOVA schema language: types, constraints, resolution and compatibility"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `#[derive(NovaSchema)]` (crate `nova-derive`).
derive = ["dep:nova-derive"]

[dependencies]
nova-value.workspace = true
nova-text.workspace = true
base64.workspace = true
unicode-segmentation = "1"
nova-derive = { path = "../nova-derive", optional = true }
