[package]
name = "nova-formats"
description = "YAML, TOML and CBOR <-> NOVA value adapters with explicit loss reporting"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nova-value = { path = "../nova-value" }
base64 = "0.22"
yaml-rust2 = "0.10"
toml = { version = "0.8", features = ["preserve_order"] }
