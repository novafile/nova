[package]
name = "novafile-schema"
description = "NOVA schema language: types, constraints, resolution and compatibility"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `#[derive(NovaSchema)]` (crate `novafile-derive`).
derive = ["dep:novafile-derive"]

[dependencies]
novafile-value.workspace = true
novafile-text.workspace = true
base64.workspace = true
unicode-segmentation = "1"
novafile-derive = { path = "../novafile-derive", optional = true }
