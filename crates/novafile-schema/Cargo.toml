[package]
name = "novafile-schema"
description = "NOVA schema language: types, constraints, resolution and compatibility"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(EUPL-1.2 OR MPL-2.0) AND Apache-2.0"  # meta/*.novs are Apache-2.0, the code EUPL-1.2 OR MPL-2.0
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `#[derive(NovaSchema)]` (crate `novafile-derive`).
derive = ["dep:novafile-derive"]
# `NovaSchema` for foreign types, mapped to the standard library (`novafile.dev/std`):
# `url::Url` as `std.Uri`, `uuid::Uuid` as `std.Uuid`, `semver::Version` as `std.SemVer`.
url = ["dep:url"]
uuid = ["dep:uuid"]
semver = ["dep:semver"]

[dependencies]
novafile-value = { workspace = true, features = ["revision"] }
novafile-text.workspace = true
base64.workspace = true
sha2.workspace = true
regex-automata.workspace = true
unicode-segmentation.workspace = true
novafile-derive = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

[lints]
workspace = true
