[package]
name = "novafile-cli"
description = "The `nvf` command-line tool: format, convert, validate, query and patch NOVA documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["nova", "cli", "configuration", "schema", "llm"]
categories = ["command-line-utilities", "config", "encoding"]

[[bin]]
name = "nvf"
path = "src/main.rs"

[dependencies]
novafile-value = { workspace = true, features = ["revision"] }
novafile-binary.workspace = true
novafile-text = { workspace = true, features = ["miette"] }
novafile-schema.workspace = true
novafile-patch.workspace = true
novafile-template.workspace = true
novafile-json.workspace = true
novafile-formats.workspace = true
novafile-proto.workspace = true
novafile-lint.workspace = true
novafile-schemars.workspace = true
serde_json.workspace = true
ureq.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
detect-coding-agent.workspace = true
getrandom = "0.4"

[lints]
workspace = true
