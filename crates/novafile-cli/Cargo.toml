[package]
name = "novafile-cli"
description = "The `nova` command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nvf"
path = "src/main.rs"

[dependencies]
novafile-value.workspace = true
novafile-binary.workspace = true
novafile-text = { workspace = true, features = ["miette"] }
novafile-schema.workspace = true
novafile-patch.workspace = true
novafile-template.workspace = true
novafile-json.workspace = true
novafile-formats.workspace = true
novafile-proto.workspace = true
novafile-lint.workspace = true
novafile-schemars.workspace = true
serde_json.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
detect-coding-agent.workspace = true

[lints]
workspace = true
