[package]
name = "novafile-value"
description = "NOVA semantic value model, canonical encoding and revisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
serde = ["dep:serde"]
facet = ["dep:facet"]
# `schemars::JsonSchema` for the value types, so derived JSON Schemas map back
# to the exact NOVA kinds (see `novafile-schemars`).
schemars = ["dep:schemars", "dep:serde_json"]

[dependencies]
sha2.workspace = true
num-bigint.workspace = true
serde = { workspace = true, optional = true }
facet = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
