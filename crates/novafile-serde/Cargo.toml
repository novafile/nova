[package]
name = "novafile-serde"
description = "Serde integration for NOVA: derive-based (de)serialization to text, binary and values"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["nova", "serde", "serialization", "deserialization"]
categories = ["encoding"]

[features]
default = ["binary", "schema"]
# `to_vec` / `from_slice`: binary frames.
binary = ["dep:novafile-binary"]
# `from_str_with_schema`: schema resolution before deserializing.
schema = ["dep:novafile-schema"]

[dependencies]
novafile-value = { workspace = true, features = ["serde"] }
novafile-text.workspace = true
novafile-binary = { workspace = true, optional = true }
novafile-schema = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
novafile-json.workspace = true
proptest.workspace = true

[lints]
workspace = true
