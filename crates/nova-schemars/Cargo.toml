[package]
name = "nova-schemars"
description = "JSON Schema and schemars integration for NOVA schemas"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The `schemars` feature gives the value types `JsonSchema` impls with `x-nova-kind` markers.
nova-value = { workspace = true, features = ["schemars"] }
nova-schema.workspace = true
nova-json.workspace = true
schemars = "1"
serde_json.workspace = true

[dev-dependencies]
nova-value = { workspace = true, features = ["serde", "schemars"] }
nova-text.workspace = true
nova-serde.workspace = true
serde.workspace = true
jsonschema = { version = "0.61", default-features = false }
