[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2 OR MPL-2.0"
rust-version = "1.90"
authors = ["Markus Mayer"]
repository = "https://github.com/novafile/nova"
homepage = "https://novafile.dev/"
readme = "README.md"
keywords = ["nova", "serialization", "configuration", "schema", "llm"]
categories = ["encoding", "parser-implementations", "config"]

[workspace.dependencies]
novafile-value = { path = "crates/novafile-value" }
novafile-binary = { path = "crates/novafile-binary" }
novafile-text = { path = "crates/novafile-text" }
novafile-schema = { path = "crates/novafile-schema" }
novafile-derive = { path = "crates/novafile-derive" }
novafile-patch = { path = "crates/novafile-patch" }
novafile-template = { path = "crates/novafile-template" }
novafile-json = { path = "crates/novafile-json" }
novafile-serde = { path = "crates/novafile-serde" }
novafile-facet = { path = "crates/novafile-facet" }
novafile-formats = { path = "crates/novafile-formats" }
novafile-proto = { path = "crates/novafile-proto" }
novafile-lint = { path = "crates/novafile-lint" }
novafile-schemars = { path = "crates/novafile-schemars" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
detect-coding-agent = "0.2"
facet = "=0.46.5"
facet-reflect = "=0.46.5"
jsonschema = { version = "0.61", default-features = false }
lsp-server = "0.7"
lsp-types = "0.95"
miette = "7"
num-bigint = "0.4"
proc-macro-crate = "3"
proc-macro2 = "1"
prost-reflect = { version = "0.16.5", features = ["text-format"] }
protox = "0.10.0"
quote = "1"
schemars = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = "2"
toml = { version = "0.8", features = ["preserve_order"] }
unicode-segmentation = "1"
yaml-rust2 = "0.10"
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every item gets a doc comment, private ones included.
missing_docs_in_private_items = "warn"
