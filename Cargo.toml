[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "EUPL-1.2 OR MPL-2.0"
rust-version = "1.95"
authors = ["Markus Mayer"]
repository = "https://github.com/novafile/nova"
homepage = "https://novafile.dev/"
readme = "README.md"
keywords = ["nova", "serialization", "configuration", "schema", "llm"]
categories = ["encoding", "parser-implementations", "config"]

[workspace.dependencies]
novafile-value = { path = "crates/novafile-value", version = "0.8.1", default-features = false }
novafile-binary = { path = "crates/novafile-binary", version = "0.8.1" }
novafile-text = { path = "crates/novafile-text", version = "0.8.1" }
novafile-schema = { path = "crates/novafile-schema", version = "0.8.1" }
novafile-derive = { path = "crates/novafile-derive", version = "0.8.1" }
novafile-patch = { path = "crates/novafile-patch", version = "0.8.1" }
novafile-template = { path = "crates/novafile-template", version = "0.8.1" }
novafile-json = { path = "crates/novafile-json", version = "0.8.1" }
novafile-serde = { path = "crates/novafile-serde", version = "0.8.1", default-features = false }
novafile-facet = { path = "crates/novafile-facet", version = "0.8.1" }
novafile-formats = { path = "crates/novafile-formats", version = "0.8.1" }
novafile-proto = { path = "crates/novafile-proto", version = "0.8.1" }
novafile-lint = { path = "crates/novafile-lint", version = "0.8.1" }
novafile-schemars = { path = "crates/novafile-schemars", version = "0.8.1" }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.8"
detect-coding-agent = "0.2"
facet = "=0.46.5"
facet-reflect = "=0.46.5"
jsonschema = { version = "0.61", default-features = false }
lsp-server = "0.10"
lsp-types = "0.97"
miette = "7"
num-bigint = "0.5"
proc-macro-crate = "3"
proc-macro2 = "1"
prost-reflect = { version = "0.16.5", features = ["text-format"] }
proptest = "1"
protox = "0.10.0"
quote = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "unicode-gencat"] }
schemars = { version = "1", default-features = false, features = ["std"] }
semver = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = "3"
toml = { version = "1.2", features = ["preserve_order"] }
unicode-segmentation = "1"
url = { version = "2.5", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false }
yaml-rust2 = "0.13"
[workspace.lints.rust]
missing_docs = "warn"
# Kani proof harnesses live behind `cfg(kani)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every item gets a doc comment, private ones included.
missing_docs_in_private_items = "warn"
